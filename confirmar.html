<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>trabajaya — Confirmar mi email</title>
<meta name="robots" content="noindex">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background:#0f0a1f; color:#e5e2f0; margin:0; padding:40px 16px; line-height:1.6; }
  .wrap { max-width: 520px; margin: 0 auto; text-align:center; }
  h1 { color:#fff; font-size: 22px; }
  p { font-size: 15px; color:#d4d0e6; }
  a { color:#a78bfa; }
  .box { background: rgba(167,139,250,.12); border:1px solid rgba(167,139,250,.35); border-radius:12px; padding:20px; margin: 20px 0; }
  .ok { border-color:#34d399; background: rgba(52,211,153,.12); }
  .err { border-color:#f87171; background: rgba(248,113,113,.12); }
  .btn { display:inline-block; margin-top:12px; padding:10px 18px; border-radius:10px; background:#7c3aed; color:#fff; text-decoration:none; font-weight:bold; }
</style>
</head>
<body>
<div class="wrap">
  <h1>trabajaya</h1>
  <div id="box" class="box" role="status" aria-live="polite">Confirmando tu email…</div>
  <p><a href="index.html">← Volver a trabajaya</a></p>
</div>
<script>
const SUPABASE_URL = "https://xutlopwenmspcougvtsv.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1dGxvcHdlbm1zcGNvdWd2dHN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Mzc2NTEsImV4cCI6MjEwMjQxMzY1MX0.s7mavW51sTjCupiq6LkbHT1YSpp0dakDsm5FS0HgL48";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
(async () => {
  const box = document.getElementById("box");
  const t = new URLSearchParams(location.search).get("t");
  if (!t || !/^[0-9a-f-]{36}$/i.test(t)) {
    box.className = "box err"; box.textContent = "El link de confirmación no es válido. Abrilo desde el mail que te mandamos."; return;
  }
  const { data, error } = await sb.rpc("confirm_email", { p_token: t });
  if (error || !data) {
    box.className = "box err";
    box.innerHTML = "No pudimos confirmar este email. Puede que el link haya caducado o ya no exista la cuenta.<br><a class='btn' href='index.html'>Anotarme de nuevo</a>";
    return;
  }
  box.className = "box ok";
  box.innerHTML = "✅ <b>¡Email confirmado!</b><br>Ya estás en la lista. El robot corre cada 2 horas: la primera tanda de ofertas y tu Kit de Búsqueda llegan en las próximas horas.<br>" +
    "<a class='btn' href='preferencias.html?t=" + encodeURIComponent(t) + "'>Ajustar mis preferencias</a>";
})();
</script>
</body>
</html>
